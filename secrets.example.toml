# Copy this file to secrets.toml (git-ignored) and paste your key.
# Free key: https://aistudio.google.com/apikey
gemini_api_key = ""

# Optional backup keys, tried in order only when the one before is out of quota,
# rejected, or can't use any of the models (e.g. a paid key behind your free one).
# Note: keys from the same Google Cloud project share one quota, and Google's terms
# don't allow using extra projects just to get around rate limits.
backup_api_keys = []

# Optional: each character's own key (or set it in Settings -> Characters -> Own Gemini key).
# A request made for a character (you named them, they were thrown, their turn to start a
# chat) tries their key first, then the keys above.
[character_keys]
# yellow = ""
# blue = ""
